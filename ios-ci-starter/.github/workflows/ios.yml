name: iOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload this build to TestFlight'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Set these as repository variables (Settings -> Secrets and variables -> Actions -> Variables)
  BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.example.app' }}
  BUNDLE_ID_PREFIX: ${{ vars.BUNDLE_ID_PREFIX || 'com.example' }}
  SCHEME: App

jobs:
  test:
    name: Build & test
    runs-on: xcode-27        # Apple Silicon image carrying Xcode 27 / iOS 27 SDK
    env:
      TEAM_ID: ''            # not needed; signing is off for tests
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a booted-capable iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '.devices | to_entries
                     | map(select(.key | test("iOS")))
                     | .[].value[] | select(.name | startswith("iPhone")) | .udid' \
            | head -1)
          if [ -z "$udid" ]; then echo "No iPhone simulator available" >&2; exit 1; fi
          xcrun simctl list devices available | grep -A5 iOS | head -20
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project App.xcodeproj \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

  testflight:
    name: Archive & TestFlight
    needs: test
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.upload)
    runs-on: xcode-27
    environment: testflight          # add required reviewers here if you want a gate
    env:
      TEAM_ID: ${{ secrets.TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | xcbeautify

      - name: Export IPA
        run: |
          set -o pipefail
          sed -e "s/__TEAM_ID__/$TEAM_ID/" ci/ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify

      - name: Upload to TestFlight
        run: |
          ipa=$(ls build/ipa/*.ipa | head -1)
          echo "Uploading $ipa"
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/ipa/*.ipa
          if-no-files-found: warn
