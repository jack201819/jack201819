name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Optional repository variables; the defaults work fine for sideloading.
  BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.example.app' }}
  BUNDLE_ID_PREFIX: ${{ vars.BUNDLE_ID_PREFIX || 'com.example' }}
  TEAM_ID: ''
  SCHEME: App

jobs:
  test:
    name: Build & test
    runs-on: xcode-27        # Apple Silicon image carrying Xcode 27 / iOS 27 SDK
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '.devices | to_entries
                     | map(select(.key | test("iOS")))
                     | .[].value[] | select(.name | startswith("iPhone")) | .udid' \
            | head -1)
          if [ -z "$udid" ]; then echo "No iPhone simulator available" >&2; exit 1; fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project App.xcodeproj \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

  ipa:
    name: Unsigned IPA
    needs: test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      # No certificates, no provisioning profiles, no Apple account needed.
      # Sideloadly re-signs this on Windows with your free Apple ID.
      - name: Archive unsigned
        run: |
          set -o pipefail
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | xcbeautify

      - name: Package into an IPA
        run: |
          app=$(ls -d build/App.xcarchive/Products/Applications/*.app | head -1)
          echo "Packaging $app"
          mkdir -p build/Payload
          cp -R "$app" build/Payload/
          (cd build && zip -qry "App-${{ github.run_number }}.ipa" Payload)
          ls -lh build/*.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-ipa-${{ github.run_number }}
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 30
